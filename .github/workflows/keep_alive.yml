name: Supabase Keep-Alive

on:
  schedule:
    # Run daily at 06:00 UTC (11:30 AM IST)
    # Daily cadence ensures Supabase free-tier never hits its 7-day inactivity pause.
    # GitHub Actions cron can skip/delay runs during high load — daily provides margin.
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      # Fast path: lightweight curl ping (no checkout/Python needed)
      - name: Quick REST ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Guard: fail loudly if secrets are not configured
          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ SUPABASE_URL secret is not set in GitHub repository secrets!"
            exit 1
          fi
          if [ -z "$SUPABASE_KEY" ]; then
            echo "❌ SUPABASE_KEY secret is not set in GitHub repository secrets!"
            exit 1
          fi

          # Normalize: strip trailing slash from URL to avoid double-slash in path
          BASE_URL="${SUPABASE_URL%/}"

          echo "Pinging: ${BASE_URL}/rest/v1/companies?select=symbol&limit=1"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${BASE_URL}/rest/v1/companies?select=symbol&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Supabase is alive (HTTP $STATUS)"
          else
            echo "❌ Supabase returned HTTP $STATUS — project may be paused or secrets may be wrong!"
            exit 1
          fi

